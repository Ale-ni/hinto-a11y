name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Installazione dipendenze
        run: npm ci
      - name: Controllo dei tipi
        run: npx tsc --noEmit
      - name: Installazione di Chromium
        run: npx playwright install --with-deps chromium
      - name: Suite di regressione
        run: npm run verify
      - name: Risultati delle scansioni
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risultati-scansioni
          path: |
            out/run.json
            out/dashboard.html
            out-react/run.json
            out-react/dashboard.html
          retention-days: 14
          if-no-files-found: ignore
