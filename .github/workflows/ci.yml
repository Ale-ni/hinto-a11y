name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Installazione dipendenze
        run: npm ci
      - name: Controllo dei tipi
        run: npx tsc --noEmit
      - name: Installazione di Chromium
        run: npx playwright install --with-deps chromium
      - name: Suite di regressione
        run: npm run verify
